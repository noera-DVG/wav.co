[package]
name = "wav-co"
version = "1.0.0"
description = "WAV.co — Music Production Assistant"
authors = ["WAV.co"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

[lib]
name = "wav_co_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "wav-co"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[features]
custom-protocol = ["tauri/custom-protocol"]
